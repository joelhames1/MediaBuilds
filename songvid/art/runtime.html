<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
'use strict';
/* Runtime for Claude-drawn scenes. Network and storage are blocked by the host.
   The host calls __load(kitSource, sceneSource, shotInfo, audioFrames) once per shot,
   then __frames(start, count) repeatedly; each returns JPEG data URLs. */

// ---------- U: helpers every scene can use ----------
const U = (() => {
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // Improved Perlin noise, 2D and 3D, output roughly -1..1
  const p = new Uint8Array(512);
  function seedNoise(seed) { const r = mulberry32(seed); const a = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } for (let i = 0; i < 512; i++) p[i] = a[i & 255]; }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), L = (a, b, t) => a + t * (b - a);
  function grad3(h, x, y, z) { const u = (h & 15) < 8 ? x : y, v = (h & 15) < 4 ? y : ((h & 15) === 12 || (h & 15) === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
  function noise3(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255; x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z), A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return L(L(L(grad3(p[AA], x, y, z), grad3(p[BA], x - 1, y, z), u), L(grad3(p[AB], x, y - 1, z), grad3(p[BB], x - 1, y - 1, z), u), v),
      L(L(grad3(p[AA + 1], x, y, z - 1), grad3(p[BA + 1], x - 1, y, z - 1), u), L(grad3(p[AB + 1], x, y - 1, z - 1), grad3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }
  const noise2 = (x, y) => noise3(x, y, 0.5);
  const fbm = (x, y, z = 0, oct = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2; a *= 0.5; } return s; };
  const hex = c => { c = c.replace('#', ''); if (c.length === 3) c = [...c].map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16)); };
  const rgba = (c, a = 1) => { const [r, g, b] = Array.isArray(c) ? c : hex(c); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  const mixColor = (c1, c2, t) => { const a = hex(c1), b = hex(c2); return rgba(a.map((v, i) => v + (b[i] - v) * t)); };
  return {
    rand: mulberry32(1), mulberry32, seedNoise, noise2, noise3, fbm, hex, rgba, mixColor,
    lerp: L, clamp: (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), map: (x, a, b, c, d) => c + (d - c) * ((x - a) / (b - a)),
    smoothstep: (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); },
    ease: { in: t => t * t * t, out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
      outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }, sine: t => -(Math.cos(Math.PI * t) - 1) / 2 },
    TAU: Math.PI * 2,
  };
})();

const canvas = document.getElementById('c');
let ctx, scene, S, AUDIO, frameIndex = 0;

window.__load = (kitSrc, sceneSrc, shot, audio) => {
  canvas.width = shot.W; canvas.height = shot.H;
  ctx = canvas.getContext('2d', { willReadFrequently: false });
  S = Object.freeze({ ...shot });
  AUDIO = audio;
  U.rand = U.mulberry32(shot.seed); U.seedNoise(shot.seed);
  Math.random = () => U.rand();  // keep scenes deterministic even if they reach for Math.random
  frameIndex = 0;
  // Kit and scene share one scope: kit helpers are plain declarations the scene can call.
  const factory = new Function('U', 'S', `"use strict";\n${kitSrc}\n;\n${sceneSrc}\n;return { setup: typeof setup === 'function' ? setup : null, draw };`);
  scene = factory(U, S);
  if (typeof scene.draw !== 'function') throw new Error('Scene code must define function draw(ctx, t, S, A)');
  ctx.save(); if (scene.setup) scene.setup(ctx, S); ctx.restore();
  return true;
};

function audioAt(i) {
  const k = Math.min(AUDIO.n - 1, Math.max(0, i));
  const A = { frame: i };
  for (const name of AUDIO.names) A[name] = AUDIO[name][k];
  return Object.freeze(A);
}

window.__frames = (start, count, quality = 0.9) => {
  const out = [];
  for (let i = start; i < start + count; i++) {
    const t = i / S.fps;
    ctx.save();
    scene.draw(ctx, t, S, audioAt(i));
    ctx.restore();
    out.push(canvas.toDataURL('image/jpeg', quality));
    frameIndex = i + 1;
  }
  return out;
};

// Quick health check for a frame: is it blank, and how long did it take to draw?
window.__probe = (i) => {
  const t0 = performance.now();
  ctx.save(); scene.draw(ctx, i / S.fps, S, audioAt(i)); ctx.restore();
  const ms = performance.now() - t0;
  const w = 64, h = 36, c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
  const g = c2.getContext('2d'); g.drawImage(canvas, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data; let min = 255, max = 0;
  for (let k = 0; k < d.length; k += 4) { const v = (d[k] + d[k + 1] + d[k + 2]) / 3; min = Math.min(min, v); max = Math.max(max, v); }
  return { ms, range: max - min };
};
</script></body></html>
